name: Agent Release

# Builds standalone filmcraft-cli binaries + the fcedit agent tool for every
# supported OS/arch and attaches them to a GitHub release. Tag with agent-v*
# to publish:   git tag agent-v0.1.0 && git push origin agent-v0.1.0

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0); used for asset names"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,      asset: linux-x86_64,   ext: tar.gz }
          - { os: ubuntu-24.04-arm,  asset: linux-aarch64,  ext: tar.gz }
          - { os: windows-latest,    asset: windows-x64,    ext: zip }
          - { os: windows-11-arm,    asset: windows-arm64,  ext: zip }
          - { os: macos-13,          asset: macos-x86_64,   ext: tar.gz }
          - { os: macos-14,          asset: macos-aarch64,  ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: filmcraft-cli-${{ matrix.asset }}

      - name: Build filmcraft-cli
        run: cargo build --release -p filmcraft-cli --locked

      - name: Stage package (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          P="pkg/filmcraft-cli-${VERSION}-${{ matrix.asset }}"
          mkdir -p "$P"
          cp target/release/filmcraft-cli "$P/"
          cp agent/fcedit.py "$P/fcedit" && chmod +x "$P/fcedit"
          cp agent/SKILL.md agent/mcp.json "$P/" 2>/dev/null || true
          mkdir -p "$P/examples" && cp agent/examples/* "$P/examples/" || true
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$P/" 2>/dev/null || true
          tar czf "filmcraft-cli-${VERSION}-${{ matrix.asset }}.${{ matrix.ext }}" -C pkg "filmcraft-cli-${VERSION}-${{ matrix.asset }}"
          sha256sum "filmcraft-cli-${VERSION}-${{ matrix.asset }}.${{ matrix.ext }}" > "filmcraft-cli-${VERSION}-${{ matrix.asset }}.${{ matrix.ext }}.sha256"

      - name: Stage package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $P = "pkg/filmcraft-cli-${{ env.VERSION }}-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "$P/examples" | Out-Null
          Copy-Item target/release/filmcraft-cli.exe "$P/"
          Copy-Item agent/fcedit.py "$P/fcedit.py"
          '@echo off`r`npython "%~dp0fcedit.py" %*' | Set-Content "$P/fcedit.cmd" -Encoding ASCII
          '@echo off`r`npython "%~dp0fcedit.py" serve %*' | Set-Content "$P/fcserve.cmd" -Encoding ASCII
          Copy-Item agent/SKILL.md, agent/mcp.json "$P/" -ErrorAction SilentlyContinue
          Copy-Item agent/examples/* "$P/examples/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE "$P/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$P" -DestinationPath "filmcraft-cli-${{ env.VERSION }}-${{ matrix.asset }}.${{ matrix.ext }}" -Force
          (Get-FileHash "filmcraft-cli-${{ env.VERSION }}-${{ matrix.asset }}.${{ matrix.ext }}" -Algorithm SHA256).Hash |
            Set-Content "filmcraft-cli-${{ env.VERSION }}-${{ matrix.asset }}.${{ matrix.ext }}.sha256" -Encoding ASCII

      - name: Smoke test — generated media through a real recipe (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          CLI="$(pwd)/target/release/filmcraft-cli"
          cat > ci-recipe.json <<'EOF'
          {"sequence": {"name": "ci", "width": 320, "height": 180, "fps": 30},
           "timeline": [
             {"op": "bars", "at": 0, "dur": 1, "name": "b"},
             {"op": "matte", "color": "#202040", "at": 1, "dur": 1, "name": "m"},
             {"op": "text", "content": "CI", "at": 0.2, "dur": 0.5, "position": [160, 150], "size": 40},
             {"op": "transition", "clip": "b", "effect": "cross_dissolve", "frames": 10, "edge": "out"}
           ],
           "export": {"path": "ci-smoke.mp4", "format": "h264"}}
          EOF
          FILMCRAFT_CLI="$CLI" python3 agent/fcedit.py build ci-recipe.json --verbose
          test -s ci-smoke.mp4
          "$CLI" probe ci-smoke.mp4 | grep -qi h264
          echo "smoke test passed"

      - name: Smoke test — generated media through a real recipe (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FILMCRAFT_CLI = "$(Get-Location)\target\release\filmcraft-cli.exe"
          @'
          {"sequence": {"name": "ci", "width": 320, "height": 180, "fps": 30},
           "timeline": [
             {"op": "bars", "at": 0, "dur": 1, "name": "b"},
             {"op": "matte", "color": "#202040", "at": 1, "dur": 1, "name": "m"},
             {"op": "text", "content": "CI", "at": 0.2, "dur": 0.5, "position": [160, 150], "size": 40},
             {"op": "transition", "clip": "b", "effect": "cross_dissolve", "frames": 10, "edge": "out"}
           ],
           "export": {"path": "ci-smoke.mp4", "format": "h264"}}
          '@ | Set-Content ci-recipe.json -Encoding ASCII
          python agent/fcedit.py build ci-recipe.json --verbose
          if (-not (Test-Path ci-smoke.mp4)) { throw "no output" }
          & $env:FILMCRAFT_CLI probe ci-smoke.mp4 | Select-String -Pattern h264 -Quiet | Out-Null
          if (-not $?) { throw "probe failed" }
          Write-Host "smoke test passed"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: FilmCraft for Agents ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            filmcraft-cli-${{ env.VERSION }}-${{ matrix.asset }}.${{ matrix.ext }}
            filmcraft-cli-${{ env.VERSION }}-${{ matrix.asset }}.${{ matrix.ext }}.sha256
